kind = "web"
previewPath = "/"
title = "Performance Connect – Event Intelligence Engine"
version = "1.0.0"
id = "artifacts/performance-connect"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19970

[services.development]
run = "pnpm --filter @workspace/performance-connect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/performance-connect", "run", "build" ]
serve = "static"
publicDir = "artifacts/performance-connect/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19970"
BASE_PATH = "/"
